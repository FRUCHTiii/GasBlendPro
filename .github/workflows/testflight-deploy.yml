name: Deploy to TestFlight

on:
  push:
    tags:
      - 'v*'

env:
  SCHEME: GasBlendPro
  CONFIGURATION: Release

jobs:
  deploy-testflight:
    name: Build and Deploy to TestFlight
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "version=$TAG" >> $GITHUB_OUTPUT
          echo "Deploying version: $TAG"

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          brew install xcbeautify
          gem install fastlane

      - name: Import Code-Signing Certificates
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATES_P12" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATES_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Set default keychain
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Clean up
          rm certificate.p12

      - name: Import Provisioning Profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Increment Build Number
        run: |
          # Get the current build number from GitHub
          BUILD_NUMBER=${{ github.run_number }}

          # Update build number in project
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "GasBlendPro/Info.plist" || true

          echo "Build number set to: $BUILD_NUMBER"

      - name: Update Version Number
        run: |
          VERSION=${{ steps.version.outputs.version }}
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "GasBlendPro/Info.plist" || true
          echo "Version number set to: $VERSION"

      - name: Build Archive
        run: |
          xcodebuild archive \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/GasBlendPro.xcarchive" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            | xcbeautify

      - name: Create ExportOptions.plist
        run: |
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>\${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>uploadBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GasBlendPro.xcarchive" \
            -exportPath "$RUNNER_TEMP/GasBlendPro" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            | xcbeautify

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/GasBlendPro/GasBlendPro.ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: GasBlendPro-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/GasBlendPro/GasBlendPro.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ runner.temp }}/GasBlendPro/GasBlendPro.ipa
          body: |
            ## Gas Blender Pro v${{ steps.version.outputs.version }}

            Released to TestFlight

            Build: ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Successfully deployed version ${{ steps.version.outputs.version }} to TestFlight!"
          echo "Build number: ${{ github.run_number }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed for version ${{ steps.version.outputs.version }}"
          exit 1
