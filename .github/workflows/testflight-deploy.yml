name: Deploy to TestFlight

on:
  push:
    tags:
      - 'v*'

env:
  SCHEME: GasBlendPro
  CONFIGURATION: Release

jobs:
  deploy-testflight:
    name: Build and Deploy to TestFlight
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          # Extract tag from GITHUB_REF (e.g., refs/tags/v0.0.5)
          TAG=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present (v0.0.5 -> 0.0.5)
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Deploying version: $VERSION (from tag: $TAG)"

      - name: Select Xcode version
        run: |
          # Use the latest available Xcode on macos-15
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "🔧 Selecting Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Fastlane
        run: |
          brew install fastlane
          fastlane --version

      - name: Setup Code Signing
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$CERTIFICATES_P12" | base64 -D > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATES_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Set as default keychain
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Import provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          TEMP_PROFILE=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE" | base64 -D > "$TEMP_PROFILE"

          # Extract provisioning profile UUID and name
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i "$TEMP_PROFILE"))
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(security cms -D -i "$TEMP_PROFILE"))

          # Copy profile with UUID as filename (this is how Xcode expects it)
          cp "$TEMP_PROFILE" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "Provisioning Profile UUID: $PROFILE_UUID"
          echo "Provisioning Profile Name: $PROFILE_NAME"

          # Verify profile is installed
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

          # Clean up
          rm $RUNNER_TEMP/certificate.p12

      - name: Deploy to TestFlight with Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NUMBER: ${{ steps.version.outputs.version }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ env.PROFILE_UUID }}
        run: |
          echo "🚀 Starting Fastlane deployment..."
          echo "📦 VERSION_NUMBER: $VERSION_NUMBER"
          echo "🔢 BUILD_NUMBER: $BUILD_NUMBER"
          echo "📱 PROVISIONING_PROFILE_SPECIFIER: $PROVISIONING_PROFILE_SPECIFIER"
          fastlane beta

      - name: Upload IPA as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: GasBlendPro-${{ steps.version.outputs.version }}
          path: "*.ipa"
          if-no-files-found: warn

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ Successfully deployed version ${{ steps.version.outputs.version }} to TestFlight!"
          echo "Build number: ${{ github.run_number }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed for version ${{ steps.version.outputs.version }}"
          exit 1
