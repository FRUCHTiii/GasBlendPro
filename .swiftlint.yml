# SwiftLint Configuration for Gas Blender Pro
# https://github.com/realm/SwiftLint

# Paths to include/exclude during linting
included:
  - GasBlendPro

excluded:
  - Pods
  - Carthage
  - DerivedData
  - .build

# Enabled rules
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - let_var_whitespace
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# Disabled rules
disabled_rules:
  - trailing_whitespace
  - todo

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

# Adjusted for realistic project needs (Views, Tests, and complex algorithms)
file_length:
  warning: 800    # Increased to accommodate SwiftUI views and comprehensive tests
  error: 1200

# SwiftUI views and test suites can be longer than typical types
type_body_length:
  warning: 600    # Increased to accommodate large SwiftUI views and test suites
  error: 800

# Safety-critical algorithms may need more lines for clarity and validation
function_body_length:
  warning: 85     # Increased to allow complex calculations with proper validation
  error: 150

# Gas blending algorithms inherently have complexity due to physics validation
cyclomatic_complexity:
  warning: 15     # Allow complex validation logic in safety-critical code
  error: 25

# Allow more parameters for backward-compatible APIs and complex calculations
function_parameter_count:
  warning: 7      # Increased to allow complex blending calculations
  error: 10

nesting:
  type_level:
    warning: 3
    error: 5

type_name:
  min_length: 3
  max_length: 50

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k

# Custom rules
custom_rules:
  double_space:
    name: "Double Space"
    regex: "([a-z,A-Z] \\s+)"
    message: "Double space between keywords"
    severity: warning

  comments_space:
    name: "Space After Comment"
    regex: "(^ *//\\w+)"
    message: "There should be a space after //"
    severity: warning

  force_https:
    name: "Force HTTPS over HTTP"
    regex: "(http://)"
    message: "HTTPS should be favored over HTTP"
    severity: warning

  no_print:
    name: "No Print Statements"
    regex: "\\bprint\\("
    message: "Use proper logging instead of print statements"
    severity: warning
    excluded: ".*Tests\\.swift"

# Reporter type (xcode, json, csv, checkstyle, codeclimate, junit, html, emoji, sonarqube, markdown, github-actions-logging)
reporter: "github-actions-logging"
